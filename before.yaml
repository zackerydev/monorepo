auth-service:
  port: 8000
  env:
    AUTH_SERVICE: http://auth-service
    DATADOG_HOST: datadog:8096
    DATADOG_PORT: "8125"
    DATADOG_TRACE_HOST: datadog:8126
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_SERVICE_NAME: auth-service
    LOG_LEVEL: info
    LOG_FORMAT: json
    ENVIRONMENT: production
    REGION: us-east-1
    CLUSTER: prod-1
    KAFKA_BROKERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
    KAFKA_SCHEMA_REGISTRY: http://schema-registry:8081
    REDIS_HOST: redis-master
    REDIS_PORT: "6379"
    POSTGRES_HOST: pg-primary.internal
    POSTGRES_PORT: "5432"
    POSTGRES_SSLMODE: require
    VAULT_ADDR: https://vault.internal:8200
    CONSUL_ADDR: http://consul.internal:8500
    FEATURE_FLAGS_URL: http://feature-flags:7000
    METRICS_ENABLED: "true"
    TRACING_ENABLED: "true"
    SHUTDOWN_GRACE_SECONDS: "30"
    SERVICE_PORT: "8000"

